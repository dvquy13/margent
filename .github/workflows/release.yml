# Release flow: release-please opens and updates a release PR on every push to main.
# Merging that PR creates the tag and GitHub release; the publish job then runs
# only when release_created is set.
#
# Publish is its own job so a failed publish can be retried with "Re-run failed
# jobs": the release-please job's outputs carry over, and the release it already
# created is not needed again. To publish an existing tag by hand (for example a
# tag whose publish never ran), run this workflow with the tag as input:
# `gh workflow run release.yml --ref main -f tag=v{x.y.z}`.
#
# Publishing uses npm trusted publishing (OIDC), not an NPM_TOKEN secret. Configure
# the trusted publisher for the `margent` package on npmjs.com (repository
# dvquy13/margent, workflow release.yml). `id-token: write` lets npm exchange the
# GitHub OIDC token for a short-lived publish credential, and `--provenance` attaches
# a signed build attestation. Trusted publishing needs npm 11.5.1 or later, hence
# the npm upgrade step.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to publish, for example v0.3.1
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - run: npm ci

      - name: Test
        env:
          BROWSER: "true"
        run: npm test

      - name: Publish
        run: npm publish --provenance --access public
